services:
  app:
    build: ./server
    init: true
    ports:
      - "127.0.0.1:${PORT:-3000}:3000"
    environment:
      APP_MODE: development
      NODE_ENV: development
      HOST: 0.0.0.0
      PORT: 3000
      SQLITE_DB_PATH: /app/data/tennis-reservation.sqlite
    volumes:
      - app-data:/app/data
    healthcheck:
      test: ["CMD", "node", "-e", "fetch('http://127.0.0.1:3000/healthz').then(r => { if (!r.ok) process.exit(1); }).catch(() => process.exit(1))"]
      interval: 30s
      timeout: 5s
      retries: 3

volumes:
  app-data:
